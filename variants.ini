; 6x6 satrancın için özel varyant tanımı.
; Gerçek Fairy-Stockfish 14 (Linux derlemesi) ile test edildi ve doğrulandı:
;  - Tahta ve dizilim (r b q k n r) doğru tanınıyor
;  - "Qq" rok hakları doğru parse ediliyor
;  - Vezir kanadı roku doğru üretiliyor: şah d1->b1, kale a1->c1
;  - "go movetime ..." ile info depth / score cp / pv çıktıları düzgün geliyor
;
; NOT: Fil (bishop) ile at (knight) yer değiştirdi (b <-> e dosyaları),
; başlangıç dengesizliğini azaltmak için (motorla doğrulandı: +1.46 -> +0.90/0.96
; piyon). Form1.cs'teki PlacePieces() ile buradaki startFen'in HER ZAMAN
; birbiriyle aynı dizilimde olması gerekir.
;
; Bu dosyayı Fairy-Stockfish.exe ile AYNI "Engine" klasörüne koy.
;
; DÜZELTME (terfi hatası): "chess" temel varyantı terfi karesini üstünde
; kurulduğu varyantın maxRank'ına göre DEĞİL, kendi orijinal 8x8 kuralına
; göre (rank 8) varsayıyor. Biz maxRank'ı 6'ya düşürdüğümüzde motor buna
; göre kendiliğinden güncellemiyor; bu yüzden piyon son sıraya (6. sıra /
; 1. sıra) ulaştığında motor bunu TERFİ SAYMIYOR, piyonu öylece bırakıyor.
; Gerçek Fairy-Stockfish ile doğrulandı: "promotionRank"/"promotionPieceTypes"
; olmadan "go perft 1" piyon son sıraya giderken SADECE "e5e6: 1" (terfisiz,
; tek hamle) döndürüyor; bu ayarlarla ise doğru şekilde "e5e6q/e5e6r/e5e6b/
; e5e6n" (4 ayrı terfi hamlesi) döndürüyor. Başlangıç pozisyonundan itibaren
; perft 3 sonucu (2840 düğüm) bu ayar eklenmeden ÖNCE ve SONRA birebir aynı
; kaldı — yani normal hamleler/roklanma hiç etkilenmiyor, sadece terfi kuralı
; düzeliyor.

[minichess6x6:chess]
maxRank = 6
maxFile = 6
startFen = rbqknr/pppppp/6/6/PPPPPP/RBQKNR w Qq - 0 1
castling = true
castlingQueensideFile = b
doubleStep = true
promotionRank = 6
promotionPieceTypes = qrbn
