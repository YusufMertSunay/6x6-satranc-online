<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analiz Tahtası · 6x6 Satranç Online</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <h1><a href="/" style="text-decoration:none" data-i18n-html="brand.titleLinked"><span class="accent">6x6</span> Satranç Online</a></h1>
  <div class="topbar-right">
    <div class="lang-switch" id="engineToggle" title="Motoru aç/kapat" data-i18n-title="analysis.engineToggleTitle">
      <button type="button" id="engineOnBtn" data-i18n="analysis.engineOn">Motor Açık</button>
      <button type="button" id="engineOffBtn" data-i18n="analysis.engineOff">Motor Kapalı</button>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button type="button" data-lang="tr">TR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="user-badge" id="userBadge">
      <span id="userName"></span>
      <span class="rating" id="userRating"></span>
    </div>
  </div>
</header>

<div class="game-layout">
  <div class="board-column">
    <div class="player-strip" id="topStrip">
      <span class="player-info">
        <span class="name" id="topName">-</span>
        <span class="rating player-rating" id="topRating"></span>
      </span>
      <span class="clock" id="topClock">--:--</span>
    </div>

    <div class="analysis-board-row">
      <div class="board-wrap">
        <div id="board"></div>
        <svg class="best-move-arrow-svg" id="bestMoveArrow"></svg>
        <svg class="best-move-arrow-svg" id="userAnnotationsSvg"></svg>
      </div>
      <div class="eval-bar-container" id="evalBarContainer">
        <div class="eval-bar-black" id="evalBarBlack"></div>
        <div class="eval-bar-white" id="evalBarWhite"></div>
      </div>
    </div>

    <div class="player-strip" id="bottomStrip">
      <span class="player-info">
        <span class="name" id="bottomName">-</span>
        <span class="rating player-rating" id="bottomRating"></span>
      </span>
      <span class="clock" id="bottomClock">--:--</span>
    </div>

    <div class="board-color-settings" id="boardColorSettings">
      <div class="bcs-row">
        <label for="lightColorInput" data-i18n="board.lightSquares">Açık kareler</label>
        <input type="color" id="lightColorInput" value="#ebecd0">
      </div>
      <div class="bcs-row">
        <label for="darkColorInput" data-i18n="board.darkSquares">Koyu kareler</label>
        <input type="color" id="darkColorInput" value="#779556">
      </div>
      <button class="secondary" type="button" id="resetBoardColorsBtn" data-i18n="board.resetColors">Varsayılana Dön</button>
    </div>

    <div class="action-row">
      <button class="secondary" id="navStartBtn" type="button" title="Başa dön" data-i18n="analysis.navStart" data-i18n-title="analysis.navStartTitle">|&lt; Başa</button>
      <button class="secondary" id="navBackBtn" type="button" title="Bir hamle geri" data-i18n="analysis.navBack" data-i18n-title="analysis.navBackTitle">&lt; Geri</button>
      <button class="secondary" id="navForwardBtn" type="button" title="Bir hamle ileri" data-i18n="analysis.navForward" data-i18n-title="analysis.navForwardTitle">İleri &gt;</button>
      <button class="secondary" id="navEndBtn" type="button" title="Oyunun sonuna git" data-i18n="analysis.navEnd" data-i18n-title="analysis.navEndTitle">Sona &gt;|</button>
      <button class="secondary" id="flipBoardBtn" type="button" data-i18n="analysis.flipBoard">Tahtayı Çevir</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="status-box" id="statusBox" data-i18n="status.loading">Yükleniyor...</div>

    <div class="eval-label" id="evalLabel" data-i18n="analysis.evalInitial">Değerlendirme: -</div>

    <div>
      <div class="hint-text" style="margin-bottom:4px" data-i18n="analysis.movesHint">Oyunun hamleleri (tıklayınca o ana gider):</div>
      <div class="moves-box" id="movesBox"></div>
    </div>

    <div>
      <div class="hint-text" style="margin-bottom:4px" data-i18n="analysis.pvHint">Motorun önerdiği varyant (PV):</div>
      <div class="pv-box" id="pvBox" title="Bu varyantı tahtaya uygula ve kaydet" data-i18n-title="analysis.pvBoxTitle">-</div>
    </div>

    <!-- Kullanıcı isteği: oyun bittikten sonraki analiz tahtasında da,
         oyuna dönmeye gerek kalmadan DOĞRUDAN yeni oyun teklif edilebilsin
         (sadece bu bitmiş oyunun iki oyuncusu için anlamlı -- bkz.
         analysis.js: initRematchAndBlockUi). -->
    <div class="hidden draw-offer-banner" id="rematchOfferBanner">
      <span data-i18n="game.rematchOfferedByOpponent">Rakibin yeni oyun teklif etti.</span>
      <div style="display:flex; gap:6px">
        <button class="primary" id="acceptRematchBtn" data-i18n="common.accept">Kabul Et</button>
        <button class="secondary" id="declineRematchBtn" data-i18n="common.decline">Reddet</button>
      </div>
    </div>

    <div class="hidden action-row" id="rematchActionRow">
      <button class="primary" id="offerRematchBtn" data-i18n="game.offerRematch">Yeni Oyun Teklif Et</button>
    </div>

    <!-- Kullanıcı isteği: komple engelleme özelliği, analiz tahtasında da
         bir düğme/seçenek olarak dursun (sadece bu oyunun iki oyuncusu
         için -- seyircinin burada "rakibi" yok). -->
    <div class="hidden action-row" id="blockOpponentRow">
      <button class="secondary" id="blockOpponentBtn" type="button" data-i18n="game.blockOpponentBtn">Rakibi Engelle</button>
    </div>

    <!-- Sohbet (kullanıcı isteği): oyun bittikten sonra oyuncu ve seyirci
         sohbetleri BİRLEŞİR, herkes aynı sohbette görebilir/yazabilir.
         game.html ile birebir AYNI markup, bkz. public/js/chat.js.
         Kullanıcı isteği: OYUNSUZ (serbest) analizde bir "oyun/rakip"
         kavramı olmadığı için sohbetin hiç anlamı yok -- bu yüzden
         varsayılan olarak GİZLİ, sadece bir OYUNA bağlı analizde
         (freeMode değilken) analysis.js: init() tarafından gösteriliyor. -->
    <div class="hidden chat-section" id="chatSection">
      <div class="chat-section-header">
        <button type="button" class="secondary tiny" id="chatHideToggleBtn" data-i18n="chat.hide">Sohbeti Gizle</button>
        <button type="button" class="secondary tiny" id="chatMuteManageBtn" data-i18n="chat.manageMutedBtn">Susturduklarım</button>
      </div>
      <div class="hidden" id="chatMutedPanel">
        <ul class="games-list" id="chatMutedList"></ul>
      </div>
      <div id="chatPanelsWrap">
        <div class="chat-box" id="primaryChatBox">
          <div class="chat-box-title" id="primaryChatTitle" data-i18n="chat.mergedChatTitle">Sohbet</div>
          <div class="chat-messages" id="primaryChatMessages"></div>
          <div class="hint-text error-text hidden" id="primaryChatHint"></div>
          <form class="chat-form" id="primaryChatForm">
            <input type="text" id="primaryChatInput" maxlength="500" data-i18n-placeholder="chat.placeholder" placeholder="Bir mesaj yaz...">
            <button class="primary" type="submit" data-i18n="chat.send">Gönder</button>
          </form>
        </div>
        <div class="chat-box hidden" id="secondaryChatBox">
          <div class="chat-box-title" id="secondaryChatTitle" data-i18n="chat.spectatorChatTitle">Seyirci Sohbeti</div>
          <div class="chat-messages" id="secondaryChatMessages"></div>
          <div class="hint-text error-text hidden" id="secondaryChatHint"></div>
          <form class="chat-form" id="secondaryChatForm">
            <input type="text" id="secondaryChatInput" maxlength="500" data-i18n-placeholder="chat.placeholder" placeholder="Bir mesaj yaz...">
            <button class="primary" type="submit" data-i18n="chat.send">Gönder</button>
          </form>
        </div>
      </div>
    </div>

    <div style="display:flex; justify-content:center; gap:16px">
      <a id="backLink" href="/" class="btn secondary" data-i18n="nav.backToGame">← Oyuna dön</a>
      <a href="/" class="btn secondary" data-i18n="nav.backToLobby">← Lobiye dön</a>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="promotionModal">
  <div class="promotion-box">
    <div data-i18n="game.choosePromotion">Terfi edecek taşı seç</div>
    <div class="options" id="promotionOptions"></div>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/challenge-widget.js"></script>
<script src="/js/analysis.js"></script>
</body>
</html>
