<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analiz Tahtası · 6x6 Satranç Online</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <h1><a href="/" style="text-decoration:none"><span class="accent">6x6</span> Satranç Online</a></h1>
  <div class="user-badge" id="userBadge">
    <span id="userName"></span>
    <span class="rating" id="userRating"></span>
  </div>
</header>

<div class="game-layout">
  <div class="board-column">
    <div class="player-strip" id="topStrip">
      <span class="player-info">
        <span class="name" id="topName">-</span>
        <span class="rating player-rating" id="topRating"></span>
      </span>
      <span class="clock" id="topClock">--:--</span>
    </div>

    <div class="analysis-board-row">
      <div class="board-wrap">
        <div id="board"></div>
        <svg class="best-move-arrow-svg" id="bestMoveArrow"></svg>
      </div>
      <div class="eval-bar-container" id="evalBarContainer">
        <div class="eval-bar-black" id="evalBarBlack"></div>
        <div class="eval-bar-white" id="evalBarWhite"></div>
      </div>
    </div>

    <div class="player-strip" id="bottomStrip">
      <span class="player-info">
        <span class="name" id="bottomName">-</span>
        <span class="rating player-rating" id="bottomRating"></span>
      </span>
      <span class="clock" id="bottomClock">--:--</span>
    </div>

    <div class="board-color-settings" id="boardColorSettings">
      <div class="bcs-row">
        <label for="lightColorInput">Açık kareler</label>
        <input type="color" id="lightColorInput" value="#ebecd0">
      </div>
      <div class="bcs-row">
        <label for="darkColorInput">Koyu kareler</label>
        <input type="color" id="darkColorInput" value="#779556">
      </div>
      <button class="secondary" type="button" id="resetBoardColorsBtn">Varsayılana Dön</button>
    </div>

    <div class="action-row">
      <button class="secondary" id="navStartBtn" type="button" title="Başa dön">|&lt; Başa</button>
      <button class="secondary" id="navBackBtn" type="button" title="Bir hamle geri">&lt; Geri</button>
      <button class="secondary" id="navForwardBtn" type="button" title="Bir hamle ileri">İleri &gt;</button>
      <button class="secondary" id="navEndBtn" type="button" title="Oyunun sonuna git">Sona &gt;|</button>
      <button class="secondary" id="flipBoardBtn" type="button">Tahtayı Çevir</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="status-box" id="statusBox">Yükleniyor...</div>

    <div class="eval-label" id="evalLabel">Değerlendirme: -</div>

    <div>
      <div class="hint-text" style="margin-bottom:4px">Oyunun hamleleri (tıklayınca o ana gider):</div>
      <div class="moves-box" id="movesBox"></div>
    </div>

    <div>
      <div class="hint-text" style="margin-bottom:4px">Motorun önerdiği varyant (PV):</div>
      <div class="pv-box" id="pvBox">-</div>
    </div>

    <div style="display:flex; justify-content:center; gap:16px">
      <a id="backLink" href="/" class="hint-text">← Oyuna dön</a>
      <a href="/" class="hint-text">← Lobiye dön</a>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="promotionModal">
  <div class="promotion-box">
    <div>Terfi edecek taşı seç</div>
    <div class="options" id="promotionOptions"></div>
  </div>
</div>

<script src="/js/analysis.js"></script>
</body>
</html>
