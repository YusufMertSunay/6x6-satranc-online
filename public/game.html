<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyun · 6x6 Satranç Online</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <h1><a href="/" style="text-decoration:none"><span class="accent">6x6</span> Satranç Online</a></h1>
  <div class="user-badge" id="userBadge">
    <span id="userName"></span>
    <span class="rating" id="userRating"></span>
  </div>
</header>

<div class="game-layout">
  <div class="board-column">
    <div class="player-strip" id="topStrip">
      <span class="name" id="topName">-</span>
      <span class="clock" id="topClock">--:--</span>
    </div>

    <div id="board"></div>

    <div class="player-strip" id="bottomStrip">
      <span class="name" id="bottomName">-</span>
      <span class="clock" id="bottomClock">--:--</span>
    </div>

    <div class="board-color-settings" id="boardColorSettings">
      <div class="bcs-row">
        <label for="lightColorInput">Açık kareler</label>
        <input type="color" id="lightColorInput" value="#ebecd0">
      </div>
      <div class="bcs-row">
        <label for="darkColorInput">Koyu kareler</label>
        <input type="color" id="darkColorInput" value="#779556">
      </div>
      <button class="secondary" type="button" id="resetBoardColorsBtn">Varsayılana Dön</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="status-box" id="statusBox">Yükleniyor...</div>

    <div class="hidden" id="gameOverBanner" class="game-over-banner"></div>

    <div class="hidden draw-offer-banner" id="drawOfferBanner">
      <span>Rakibin beraberlik teklif etti.</span>
      <div style="display:flex; gap:6px">
        <button class="primary" id="acceptDrawBtn">Kabul Et</button>
        <button class="secondary" id="declineDrawBtn">Reddet</button>
      </div>
    </div>

    <div class="hidden draw-offer-banner" id="rematchOfferBanner">
      <span>Rakibin yeni oyun teklif etti.</span>
      <div style="display:flex; gap:6px">
        <button class="primary" id="acceptRematchBtn">Kabul Et</button>
        <button class="secondary" id="declineRematchBtn">Reddet</button>
      </div>
    </div>

    <div class="hidden action-row" id="rematchActionRow">
      <button class="primary" id="offerRematchBtn">Yeni Oyun Teklif Et</button>
    </div>

    <div class="moves-box" id="movesBox"></div>

    <div class="action-row">
      <button class="secondary" id="offerDrawBtn">Beraberlik Teklif Et</button>
      <button class="danger" id="resignBtn">Teslim Ol</button>
    </div>

    <a href="/" class="hint-text" style="text-align:center">← Lobiye dön</a>
  </div>
</div>

<div class="modal-overlay hidden" id="promotionModal">
  <div class="promotion-box">
    <div>Terfi edecek taşı seç</div>
    <div class="options" id="promotionOptions"></div>
  </div>
</div>

<script src="/js/game.js"></script>
</body>
</html>
